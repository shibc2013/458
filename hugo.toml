baseURL = 'https://458.shibc.cloud/'
theme = 'blowfish2'
defaultContentLanguage = 'zh-cn'
enableRobotsTXT = true

enableEmoji = true

# 允许渲染日期在当前构建时间之后的档位（隔日档位提前生成时需要）
buildFuture = true

[pagination]
  pagerSize = 100

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
