{{- /* 班级快报上线弹窗：由 baseof.html 注入，任意页面加载即弹出 */ -}}
<div id="announcement-modal" role="dialog" aria-modal="true"
  style="position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.72);padding:1rem;">
  <div
    style="position:relative;max-width:920px;width:100%;background:#ffffff;color:#1f2937;border-radius:1rem;box-shadow:0 20px 60px rgba(0,0,0,0.45);padding:1.75rem;text-align:center;max-height:92vh;overflow:auto;">
    <button id="announcement-close" type="button" aria-label="关闭"
      style="position:absolute;top:0.6rem;right:0.6rem;width:2.4rem;height:2.4rem;border-radius:9999px;border:0;cursor:pointer;background:#e5e7eb;color:#374151;font-size:1.4rem;line-height:1;">&times;</button>
    <h2 style="font-size:2.4rem;font-weight:800;margin:0 2.5rem 1.1rem 0;color:#0d9488;">458班报第一期已上线!</h2>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:0.9rem;margin-bottom:1.4rem;">
      <img src="/images/class-bulletin/banbao-2026-09-30-1.png" alt="运动会现场1"
        style="width:46%;min-width:150px;border-radius:0.6rem;border:1px solid #d1d5db;object-fit:cover;" loading="lazy" />
      <img src="/images/class-bulletin/banbao-2026-09-30-2.png" alt="运动会现场2"
        style="width:46%;min-width:150px;border-radius:0.6rem;border:1px solid #d1d5db;object-fit:cover;" loading="lazy" />
    </div>
    <a id="announcement-detail" href="/news/class-bulletin/2026-09-30/"
      style="display:inline-block;padding:0.7rem 2.2rem;border-radius:9999px;background:#0d9488;color:#ffffff;font-weight:700;font-size:1.1rem;text-decoration:none;">查看详情</a>
  </div>
</div>
<script>
  (function () {
    var KEY = "banbao_modal_closed";
    try {
      if (localStorage.getItem(KEY) === "1") return;
    } catch (e) {}
    var modal = document.getElementById("announcement-modal");
    if (!modal) return;
    function show() { modal.style.display = "flex"; }
    function hide() {
      modal.style.display = "none";
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
    }
    var closeBtn = document.getElementById("announcement-close");
    if (closeBtn) closeBtn.addEventListener("click", hide);
    modal.addEventListener("click", function (e) { if (e.target === modal) hide(); });
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", show);
    } else {
      show();
    }
  })();
</script>
